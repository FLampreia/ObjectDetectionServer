version: "3.9"

services:
  web:
    build: .
    ports:
      - "8000:80"
    environment:
      - DB_USER=admin
      - DB_PASSWORD=secret
      - DB_NAME=objectDetection.db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis

  redis:
    image: redis:7
    ports:
      - "6379:6379"