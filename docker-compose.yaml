services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:80"
    env_file:
      - .env
    environment:
      - DB_NAME=/app/data/objectDetection.db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PROCESSOR_HOST=${DOCKER_PROCESSOR_HOST:-host.docker.internal}
      - PROCESSOR_PORT=${DOCKER_PROCESSOR_PORT:-8001}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis_data:
